modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="https://github.com/Agwstin/ArsScryAnywhere/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

displayURL="https://github.com/Agwstin/ArsScryAnywhere" #optional

logoFile="arsscryanywhere.png" #optional

authors="${mod_authors}" #optional

description='''${mod_description}'''

# Server-side logic only: clients without the mod can still join a server that has it
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    type="required"
    versionRange="[5.11.0,)"
    ordering="AFTER"
    side="BOTH"
